# config/nginx.conf — 掛成容器內的 /etc/nginx/conf.d/default.conf。
#
# 只覆蓋 server 區塊, 不接管上游 /etc/nginx/nginx.conf;
# 容器僅作為 liva nginx reverse proxy 的後端, 不處理 TLS 與 rate limit。
# 8329 與 liva compose 的 ports:、deployment.yml 維持同號。
server {
    listen      8329;
    listen      [::]:8329;
    server_name _;
    root        /home/app/out/html;
    index       index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /health {
        access_log   off;
        default_type text/plain;
        return 200   "ok\n";
    }
}
