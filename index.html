<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shuk Gallery</title>
    <meta name="description" content="Shuk's Gallery - Software Engineer & Developer Portfolio">
    <meta property="og:site_name" content="Shuk's Gallery">
    <meta name="referrer" content="no-referrer">

    <link rel="shortcut icon" type="image/gif" href="https://i.imgur.com/QpGrcBZ.jpg?1">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* index.html - Pastoral (田園風) Gallery page styles */

        :root {
            --bg-color: #FAF8F5;
            --text-color: #2E3A2F;
            --text-muted: #6B7C6E;
            --primary-color: #4A5D4E;
            --primary-light: #A2B29F;
            --accent-color: #D4A373;
            --border-color: #E6E1D8;
            --card-bg: #FFFFFF;

            --font-serif: 'Cormorant Garamond', 'Newsreader', serif;
            --font-sans: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #FAF8F5 0%, #F1EDE4 100%);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==== Scrollbar ==== */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #F1EDE4;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 5px;
            border: 2px solid #F1EDE4;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color);
        }

        /* ==== Header ==== */
        header {
            text-align: center;
            padding: 5rem 1rem 3rem;
        }

        header h1 {
            font-family: var(--font-serif);
            font-size: clamp(2.5rem, 7vw, 4.2rem);
            font-weight: 300;
            margin-bottom: 0.25rem;
            letter-spacing: 4px;
            color: var(--primary-color);
            text-wrap: balance;
        }

        header .subtitle {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: clamp(1.05rem, 2.5vw, 1.35rem);
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-wrap: balance;
        }

        .botanical-divider {
            margin: 1.5rem auto 0;
            max-width: 160px;
            color: var(--primary-light);
            opacity: 0.75;
        }

        .leaf-svg {
            width: 100%;
            height: auto;
        }

        /* ==== Main Gallery ==== */
        main {
            flex: 1;
        }

        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 2rem 4rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
        }

        /* Gallery Item - Framed Art Style */
        .gallery-item {
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            background-size: 104%;
            background-position: center;
            background-repeat: no-repeat;
            /* Inset shadow creates a vintage picture frame double matte look */
            box-shadow: 
                inset 0 0 0 10px #FAF7F2, 
                inset 0 0 0 11px var(--border-color), 
                0 6px 18px rgba(47, 58, 47, 0.06);
            opacity: 0;
            transform: translateY(24px);
            animation: fadeInUp 0.7s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
            transition: 
                transform 0.45s cubic-bezier(0.165, 0.84, 0.44, 1), 
                box-shadow 0.45s ease, 
                background-size 0.45s cubic-bezier(0.165, 0.84, 0.44, 1);
            text-decoration: none;
            display: block;
        }

        .gallery-item:hover {
            transform: translateY(-6px);
            background-size: 112%;
            box-shadow: 
                inset 0 0 0 10px #FAF7F2, 
                inset 0 0 0 11px var(--accent-color), 
                0 16px 32px rgba(47, 58, 47, 0.12);
        }

        /* Persistent tile caption - bottom right, muted so the photo stays the subject */
        .gallery-item-caption {
            position: absolute;
            right: 16px;
            bottom: 16px;
            z-index: 1;
            max-width: calc(100% - 32px);
            padding: 2px 8px;
            border-radius: 3px;
            background-color: rgba(32, 38, 32, 0.42);
            color: rgba(252, 250, 247, 0.82);
            font-family: var(--font-sans, inherit);
            font-size: 0.66rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: lowercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: opacity 0.35s ease;
        }

        /* The hover overlay carries the full title, so the caption steps aside. */
        .gallery-item:hover .gallery-item-caption {
            opacity: 0;
        }

        /* Hover Overlay - Floating Inset Frame */
        .gallery-item-overlay {
            position: absolute;
            inset: 18px;
            background-color: rgba(74, 93, 78, 0.84);
            border: 1px solid var(--accent-color);
            border-radius: 2px;
            color: #FAF8F5;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.215, 0.61, 0.355, 1);
            text-align: center;
            padding: 1.5rem;
            backdrop-filter: blur(1.5px);
        }

        .gallery-item:hover .gallery-item-overlay {
            opacity: 1;
            transform: scale(1);
        }

        .gallery-item-title {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #FAF8F5;
            line-height: 1.4;
            text-wrap: balance;
        }

        .gallery-item-title::after {
            content: '✿';
            display: block;
            margin-top: 0.6rem;
            font-size: 0.75rem;
            color: var(--accent-color);
            opacity: 0.9;
        }

        /* ==== Footer ==== */
        footer {
            border-top: 1px solid var(--border-color);
            background-color: rgba(241, 237, 228, 0.4);
            padding: 4rem 1rem 3rem;
            text-align: center;
        }

        .footer-divider {
            color: var(--primary-light);
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }

        .footer-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .footer-nav a {
            font-family: var(--font-sans);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-color);
            transition: color 0.3s ease;
        }

        .footer-nav a:hover {
            color: var(--accent-color);
        }

        .nav-dot {
            color: var(--accent-color);
            font-size: 0.6rem;
            opacity: 0.7;
        }

        .copyright {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        /* ==== Animations ==== */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==== Responsive ==== */
        @media (max-width: 768px) {
            .gallery-container {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1.5rem;
                padding: 1rem 1.5rem 3rem;
            }

            header {
                padding: 4rem 1rem 2rem;
            }

            .gallery-item-overlay {
                inset: 12px;
                padding: 1rem;
            }

            .gallery-item-caption {
                right: 11px;
                bottom: 11px;
                font-size: 0.6rem;
            }

            .gallery-item-title {
                font-size: 1.05rem;
                letter-spacing: 1px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .gallery-item {
                animation: none;
                opacity: 1;
                transform: none;
                transition: none;
            }
            .gallery-item:hover {
                transform: none;
                background-size: 104%;
                box-shadow: 
                    inset 0 0 0 10px #FAF7F2, 
                    inset 0 0 0 11px var(--border-color), 
                    0 6px 18px rgba(47, 58, 47, 0.06);
            }
            .gallery-item-overlay {
                transform: none;
                transition: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>SHUK LIU</h1>
        <p class="subtitle">Software Engineer & Developer Portfolio</p>
        <div class="botanical-divider">
            <svg viewBox="0 0 100 20" class="leaf-svg" aria-hidden="true">
                <path d="M15 10 Q 35 15, 50 10 T 85 10" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.6"/>
                <!-- Left branch leaves -->
                <path d="M30 11 C 28 8, 24 9, 26 12 C 28 15, 32 14, 30 11 Z" fill="currentColor" opacity="0.8"/>
                <path d="M42 12 C 40 9, 36 10, 38 13 C 40 16, 44 15, 42 12 Z" fill="currentColor" opacity="0.8"/>
                <!-- Right branch leaves -->
                <path d="M58 9 C 60 6, 64 7, 62 10 C 60 13, 56 12, 58 9 Z" fill="currentColor" opacity="0.8"/>
                <path d="M70 10 C 72 7, 76 8, 74 11 C 72 14, 68 13, 70 10 Z" fill="currentColor" opacity="0.8"/>
                <!-- Center bud -->
                <circle cx="50" cy="10" r="1.5" fill="currentColor"/>
            </svg>
        </div>
    </header>

    <main>
        <div class="gallery-container" id="gallery">
            <!-- Gallery items will be injected here via JavaScript -->
        </div>
    </main>

    <footer>
        <div class="footer-divider">
            <span class="leaf-icon">🌿</span>
        </div>
        <nav class="footer-nav">
            <a href="pkg/resume/index.html">Resume</a>
            <span class="nav-dot">✦</span>
            <a href="pkg/surf/index.html">Surf Editorial</a>
            <span class="nav-dot">✦</span>
            <a href="https://github.com/BizShuk" target="_blank" rel="noopener noreferrer">GitHub</a>
            <span class="nav-dot">✦</span>
            <a href="https://www.linkedin.com/in/initialshuk" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </nav>
        <p class="copyright">Shuk Liu &copy; 2026. Cultivated in Taiwan.</p>
    </footer>

    <script>
        /* index.html - Gallery page logic
         * Loads gallery data from data/gallery.json and renders it into the grid.
         */
        document.addEventListener('DOMContentLoaded', () => {
            const galleryContainer = document.getElementById('gallery');

            fetch('data/gallery.json')
                .then(response => response.json())
                .then(data => {
                    data.forEach((item, index) => {
                        // Items with a link become anchors; otherwise render as a decorative block.
                        const isLink = item.link && item.link.trim() !== '';
                        const elem = document.createElement(isLink ? 'a' : 'div');

                        elem.className = 'gallery-item';

                        if (isLink) {
                            elem.href = item.link;
                            elem.target = '_blank';
                            elem.rel = 'noopener noreferrer';
                        }

                        // Extract background image url from style string
                        // e.g. "url('https://i.imgur.com/SpbbJ3z.jpg?1')"
                        if (item.style && item.style.backgroundImage) {
                            elem.style.backgroundImage = item.style.backgroundImage;
                        }

                        // Staggered animation
                        elem.style.animationDelay = `${index * 0.05}s`;

                        if (item.img_title) {
                            // Persistent, understated label so each tile says where it goes.
                            const caption = document.createElement('span');
                            caption.className = 'gallery-item-caption';
                            caption.textContent = item.img_title;
                            elem.appendChild(caption);

                            const overlay = document.createElement('div');
                            overlay.className = 'gallery-item-overlay';

                            const title = document.createElement('h3');
                            title.className = 'gallery-item-title';
                            title.textContent = item.img_title;

                            overlay.appendChild(title);
                            elem.appendChild(overlay);
                        }

                        galleryContainer.appendChild(elem);
                    });
                })
                .catch(error => console.error('Error loading gallery data:', error));
        });
    </script>
</body>
</html>
