<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shuk Gallery</title>
    <meta name="description" content="Shuk's Gallery">
    <meta property="og:site_name" content="Shuk's Gallery">

    <link rel="shortcut icon" type="image/gif" href="https://i.imgur.com/QpGrcBZ.jpg?1">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --hover-overlay: rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 4rem 1rem 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        header p {
            font-size: 1.1rem;
            font-weight: 300;
            color: #666;
        }

        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            display: block;
            background-color: #e0e0e0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s forwards;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .gallery-item-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--hover-overlay);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
            padding: 1rem;
        }

        .gallery-item:hover .gallery-item-overlay {
            opacity: 1;
        }

        .gallery-item-title {
            font-size: 1.25rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .gallery-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
                padding: 1rem;
            }
            header {
                padding: 3rem 1rem 1rem;
            }
            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>SHUK LIU</h1>
        <p>Software Engineer & Developer Portfolio</p>
    </header>

    <main>
        <div class="gallery-container" id="gallery">
            <!-- Gallery items will be injected here via JavaScript -->
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const galleryContainer = document.getElementById('gallery');

            fetch('gallery_elem.json')
                .then(response => response.json())
                .then(data => {
                    data.forEach((item, index) => {
                        // Skip empty items if they have no link and no title, though we can display them as decorative
                        // Actually let's display all as per original, but make them unclickable if no link
                        const isLink = item.link && item.link.trim() !== '';
                        const elem = document.createElement(isLink ? 'a' : 'div');

                        elem.className = 'gallery-item';

                        if (isLink) {
                            elem.href = item.link;
                            elem.target = '_blank';
                            elem.rel = 'noopener noreferrer';
                        }

                        // Extract background image url from style string
                        // e.g. "url('https://i.imgur.com/SpbbJ3z.jpg?1')"
                        if (item.style && item.style.backgroundImage) {
                            elem.style.backgroundImage = item.style.backgroundImage;
                        }

                        // Staggered animation
                        elem.style.animationDelay = `${index * 0.05}s`;

                        if (item.img_title) {
                            const overlay = document.createElement('div');
                            overlay.className = 'gallery-item-overlay';

                            const title = document.createElement('h3');
                            title.className = 'gallery-item-title';
                            title.textContent = item.img_title;

                            overlay.appendChild(title);
                            elem.appendChild(overlay);
                        }

                        galleryContainer.appendChild(elem);
                    });
                })
                .catch(error => console.error('Error loading gallery data:', error));
        });
    </script>
</body>
</html>
